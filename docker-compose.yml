services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: proxmox_dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - dashboard-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - VITE_APP_TITLE=${VITE_APP_TITLE:-Architecture Dashboard}
    networks:
      - proxmox_dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-3000}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  dashboard-data:

networks:
  proxmox_dashboard-network:
    driver: bridge
